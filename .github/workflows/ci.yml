# 저장소 기본 검사. 검사 이름 `ci`는 브랜치 보호의 필수 상태 검사 이름으로 쓰이므로 바꾸지 않는다.
# 구조 (ADR-077): 잡 `checks`(린트 · 타입 · 단위 · 빌드 · 형식 · 픽스처 · 화면 e2e)와 `pipeline-e2e`(파이프라인 e2e)가
# 병렬로 돌고, 이름이 `ci`인 집계 잡이 둘을 기다려 둘 다 성공일 때만 성공한다.
# `pipeline-e2e`는 두 묶음 잡 `pipeline-e2e-group (1)` · `(2)`를 모으는 집계 잡이다 (M3-24).
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 PR(또는 같은 ref)의 이전 실행은 새 실행이 시작되면 취소한다. main push는 취소하지 않는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    # 최근 실측 16 ~ 25분(느린 러너에서 단계 전체가 약 1.5배), 30분 제한의 83%까지 와서 40분 (ADR-138 · ADR-154)
    timeout-minutes: 40
    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      # 버전을 지정하지 않으면 루트 package.json의 packageManager(pnpm@x.y.z)를 따른다
      - name: pnpm 설치
        uses: pnpm/action-setup@v6

      - name: Node 22 설치 · pnpm 저장소 캐시
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          # 픽스처는 독립 lockfile을 쓰므로 캐시 키에 함께 넣는다
          cache-dependency-path: |
            pnpm-lock.yaml
            fixtures/sample-next-app/pnpm-lock.yaml

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 린트
        run: pnpm lint

      - name: 타입 검사
        run: pnpm typecheck

      - name: 단위 테스트
        run: pnpm test

      - name: 빌드
        run: pnpm build

      - name: 형식 검사
        run: pnpm format:check

      # 초기화 스크립트의 경로 가드 · 추적 파일 복사 검사 (임시 복사본에서 실행, 실제 저장소는 건드리지 않음)
      - name: 초기화 스크립트 검사
        run: scripts/test-reset-fixture.sh

      # 변형 스크립트의 거부 · 변형별 커밋 하나 · 예제 선언의 위반 수 검사 (M3-02). 앞 단계의 파서 빌드를 쓰고,
      # 픽스처 사본은 임시 폴더에 설치 없이 만든다
      - name: 변형 스크립트 검사
        run: scripts/test-make-variant.sh

      # 로드맵 발행 스크립트의 재발행 시험 (M2-05, 가짜 gh 응답으로 돌고 GitHub를 부르지 않는다)과
      # 파이프라인 e2e 묶음 대조 스크립트의 시험 (M3-24), 이 워크플로의 잡 제한 시간 · needs 시험 (M3-52)
      - name: 파이썬 스크립트 검사
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      # 테스트 대상 픽스처 (M0-08). 루트 워크스페이스 밖의 독립 프로젝트라 자기 lockfile로 따로 설치한다.
      - name: 픽스처 의존성 설치
        working-directory: fixtures/sample-next-app
        run: pnpm install --frozen-lockfile

      # 임시 SQLite에 마이그레이션 → next build → next start 뒤 HTTP 테스트 (ADR-026과 같은 기동 순서)
      - name: 픽스처 테스트
        working-directory: fixtures/sample-next-app
        run: pnpm test
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      # 화면 e2e (M0-07, architecture.md 8장). 브라우저 처리 (ADR-043):
      # 러너에 깔린 Google Chrome이 있으면 PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH로 그것을 쓰고 내려받지 않는다.
      # 없을 때만 Playwright Chromium을 설치하고 ~/.cache/ms-playwright를 Playwright 버전별로 캐시한다.
      # (이 VM에서는 설치하지 않고 /opt/pw-browsers의 Chromium을 지정한다, ADR-028)
      - name: 화면 e2e 브라우저 확인
        id: browser
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -n "$chrome" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$chrome" >> "$GITHUB_ENV"
            echo "system=true" >> "$GITHUB_OUTPUT"
            "$chrome" --version
          else
            echo "system=false" >> "$GITHUB_OUTPUT"
          fi
          echo "playwright=$(node -p "require('./packages/app/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 화면 e2e 브라우저 캐시
        if: steps.browser.outputs.system != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.browser.outputs.playwright }}

      - name: 화면 e2e 브라우저 설치
        if: steps.browser.outputs.system != 'true'
        run: pnpm --filter @bive/app exec playwright install chromium --with-deps

      - name: 화면 e2e
        run: pnpm e2e

      # 스크린샷(artifacts/screens) · 실패 추적 · 보고서. 실패해도 올린다
      - name: 화면 e2e 산출물 업로드
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # 파이프라인 e2e (M1-21 · M1-29, architecture.md 8장, ADR-071 · ADR-077): 픽스처 복사본 · 실제 git · 실제 판정 러너 ·
  # ScriptedAdapter로 요구사항 저장부터 실행 종료까지. 시험마다 실제 설치 · next build를 여러 번 해서 `checks`와 나눠 병렬로 돈다.
  # 한 잡이 15 ~ 20분 걸려 두 묶음으로 나눠 병렬로 돈다 (M3-24): 묶음 1은 아래 PIPELINE_E2E_GROUP1에 적은 파일만,
  # 묶음 2는 그 밖의 모든 파일(새 파일 포함)을 돈다. 묶음별로 실제로 돈 파일을 vitest json 보고서로 남기고
  # 집계 잡 `pipeline-e2e`가 시험 폴더의 파일 목록과 대조한다. 각 묶음은 따로 러너라 포트 · TMPDIR이 겹치지 않는다
  pipeline-e2e-group:
    name: pipeline-e2e-group (${{ matrix.group }})
    runs-on: ubuntu-24.04
    # 최근 실측 묶음마다 12 ~ 21분 (ADR-138)
    timeout-minutes: 40
    strategy:
      # 한 묶음이 실패해도 다른 묶음의 결과를 본다
      fail-fast: false
      matrix:
        group: [1, 2]
    env:
      # 묶음 1의 파일(시험 폴더 기준). 가장 느린 multi-rule(CI에서 약 4 ~ 7분)과 나머지를 시간으로 맞춰 둔다.
      # 묶음 2에는 흐름 4개를 도는 contradiction(CI에서 약 12분)이 있다(M7-17).
      # 묶음 2는 이 목록 밖의 전부다. 파일을 옮길 때는 여기만 고친다
      PIPELINE_E2E_GROUP1: >-
        multi-rule.test.ts
        fail-check.test.ts
        network.test.ts
        budget-exceeded.test.ts
        extra-mcp.test.ts
        norm-input.test.ts
        auto-start-per-rule.test.ts
        run-queue.test.ts
        false-pass.test.ts
        merge-conflict.test.ts
        happy-path.test.ts
    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: pnpm 설치
        uses: pnpm/action-setup@v6

      - name: Node 22 설치 · pnpm 저장소 캐시
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            fixtures/sample-next-app/pnpm-lock.yaml

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # 시험의 픽스처 복사본(`scripts/reset-fixture.sh`)과 판정 러너의 설치가 이 설치로 채운 pnpm 저장소를 쓴다
      - name: 픽스처 의존성 설치
        working-directory: fixtures/sample-next-app
        run: pnpm install --frozen-lockfile

      # 로컬 `pnpm e2e:pipeline`과 같은 설정(vitest.pipeline.config.ts)에 묶음의 파일 필터만 더한다
      - name: 파이프라인 e2e
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          GROUP: ${{ matrix.group }}
        run: |
          args=()
          for f in $PIPELINE_E2E_GROUP1; do
            if [ "$GROUP" = 1 ]; then
              args+=("e2e/pipeline/$f")
            else
              args+=(--exclude "e2e/pipeline/$f")
            fi
          done
          pnpm --filter @bive/orchestrator e2e:pipeline \
            --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/pipeline-e2e-report.json" \
            "${args[@]}"

      # 이 묶음에서 실제로 돈 파일 목록(대조용). 실패해도 올린다
      - name: 파이프라인 e2e 보고서 업로드
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-e2e-report-${{ matrix.group }}
          path: ${{ runner.temp }}/pipeline-e2e-report.json
          if-no-files-found: error
          retention-days: 14

  # 검사 `pipeline-e2e`: 나뉜 묶음이 모두 성공이고 시험 폴더의 모든 파일이 정확히 한 묶음에서 돌았을 때만 성공한다.
  # 묶음 잡이 실패 · 취소 · 건너뜀이어도 `always()`로 돌아 실패로 끝난다(건너뛴 잡은 성공으로 처리되므로 이 잡이
  # 건너뛰어지면 안 된다). 대조와 결과 확인은 앞 단계가 실패해도 각각 돌아 둘 다 로그에 남는다
  pipeline-e2e:
    name: pipeline-e2e
    needs: [pipeline-e2e-group]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: 파이프라인 e2e 보고서 내려받기
        uses: actions/download-artifact@v8
        with:
          pattern: pipeline-e2e-report-*
          path: ${{ runner.temp }}/pipeline-e2e-reports

      # 새 파일이 어느 묶음에서도 빠지거나 두 묶음에서 겹쳐 돌지 않았는지 본다 (자체 시험: scripts/test_check_pipeline_groups.py).
      # 받은 보고서가 하나뿐이면 download-artifact가 하위 폴더 없이 풀므로 위치를 가정하지 않고 찾는다
      - name: 묶음 대조
        if: ${{ always() }}
        run: |
          mapfile -t reports < <(find "$RUNNER_TEMP/pipeline-e2e-reports" -name pipeline-e2e-report.json 2>/dev/null | sort)
          python3 scripts/check-pipeline-groups.py --dir packages/orchestrator/e2e/pipeline "${reports[@]}"

      - name: 묶음 결과 확인
        if: ${{ always() }}
        env:
          GROUPS_RESULT: ${{ needs.pipeline-e2e-group.result }}
        run: |
          echo "pipeline-e2e-group: $GROUPS_RESULT"
          if [ "$GROUPS_RESULT" != "success" ]; then
            echo "파이프라인 e2e 묶음이 모두 성공하지 않았습니다" >&2
            exit 1
          fi

  # 필수 검사 `ci`: 두 잡이 모두 성공일 때만 성공한다. 한쪽이 실패 · 취소 · 건너뜀이어도 이 잡은 `always()`로 돌아
  # 실패로 끝난다(건너뛴 잡은 브랜치 보호에서 성공으로 처리되므로 이 잡 자체가 건너뛰어지면 안 된다).
  ci:
    name: ci
    needs: [checks, pipeline-e2e]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 검사 결과 확인
        env:
          CHECKS: ${{ needs.checks.result }}
          PIPELINE: ${{ needs.pipeline-e2e.result }}
        run: |
          echo "checks: $CHECKS"
          echo "pipeline-e2e: $PIPELINE"
          if [ "$CHECKS" != "success" ] || [ "$PIPELINE" != "success" ]; then
            echo "필수 잡이 성공하지 않았습니다" >&2
            exit 1
          fi
