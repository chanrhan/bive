# 저장소 기본 검사. 잡 이름 `ci`는 브랜치 보호의 필수 상태 검사 이름으로 쓰이므로 바꾸지 않는다.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 PR(또는 같은 ref)의 이전 실행은 새 실행이 시작되면 취소한다. main push는 취소하지 않는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      # 버전을 지정하지 않으면 루트 package.json의 packageManager(pnpm@x.y.z)를 따른다
      - name: pnpm 설치
        uses: pnpm/action-setup@v6

      - name: Node 22 설치 · pnpm 저장소 캐시
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          # 픽스처는 독립 lockfile을 쓰므로 캐시 키에 함께 넣는다
          cache-dependency-path: |
            pnpm-lock.yaml
            fixtures/sample-next-app/pnpm-lock.yaml

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 린트
        run: pnpm lint

      - name: 타입 검사
        run: pnpm typecheck

      - name: 단위 테스트
        run: pnpm test

      - name: 빌드
        run: pnpm build

      - name: 형식 검사
        run: pnpm format:check

      # 초기화 스크립트의 경로 가드 · 추적 파일 복사 검사 (임시 복사본에서 실행, 실제 저장소는 건드리지 않음)
      - name: 초기화 스크립트 검사
        run: scripts/test-reset-fixture.sh

      # 테스트 대상 픽스처 (M0-08). 루트 워크스페이스 밖의 독립 프로젝트라 자기 lockfile로 따로 설치한다.
      - name: 픽스처 의존성 설치
        working-directory: fixtures/sample-next-app
        run: pnpm install --frozen-lockfile

      # 임시 SQLite에 마이그레이션 → next build → next start 뒤 HTTP 테스트 (ADR-026과 같은 기동 순서)
      - name: 픽스처 테스트
        working-directory: fixtures/sample-next-app
        run: pnpm test
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      # 화면 e2e (M0-07, architecture.md 8장). 브라우저 처리 (ADR-043):
      # 러너에 깔린 Google Chrome이 있으면 PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH로 그것을 쓰고 내려받지 않는다.
      # 없을 때만 Playwright Chromium을 설치하고 ~/.cache/ms-playwright를 Playwright 버전별로 캐시한다.
      # (이 VM에서는 설치하지 않고 /opt/pw-browsers의 Chromium을 지정한다, ADR-028)
      - name: 화면 e2e 브라우저 확인
        id: browser
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -n "$chrome" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$chrome" >> "$GITHUB_ENV"
            echo "system=true" >> "$GITHUB_OUTPUT"
            "$chrome" --version
          else
            echo "system=false" >> "$GITHUB_OUTPUT"
          fi
          echo "playwright=$(node -p "require('./packages/app/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 화면 e2e 브라우저 캐시
        if: steps.browser.outputs.system != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.browser.outputs.playwright }}

      - name: 화면 e2e 브라우저 설치
        if: steps.browser.outputs.system != 'true'
        run: pnpm --filter @bive/app exec playwright install chromium --with-deps

      - name: 화면 e2e
        run: pnpm e2e

      # 스크린샷(artifacts/screens) · 실패 추적 · 보고서. 실패해도 올린다
      - name: 화면 e2e 산출물 업로드
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
