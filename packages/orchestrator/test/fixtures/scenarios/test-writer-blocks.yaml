# test-writer.test.ts 전용 (M3-01 #46). 블록 선언이 있는 프로젝트에서 세션 디렉터리의 읽기 전용 사본(blocks.json)을 읽고,
# 고쳐 쓰기를 시도한 뒤(경로 가드가 거부해야 한다) 대상 규칙 폴더에 인수 테스트 1개를 쓴다.
name: test-writer-blocks
description: test-writer가 블록 선언 사본을 읽고 덮어쓰기를 시도한 뒤 대상 규칙 폴더에만 쓴다
roles:
  test-writer:
    sessions:
      - turns:
          - tool: read_file
            args:
              path: blocks.json
          - tool: write_file
            args:
              path: blocks.json
              content: '{"blocks":[{"name":"lib","kind":"shared","include":["**"],"public":["**"],"dependsOn":[],"risk":"low"}]}'
          - tool: write_file
            args:
              path: ./blocks.json
              content: '{}'
          - tool: write_file
            args:
              path: bive-acceptance/{{ruleId}}/health-time.acc.ts
              content: |
                // {{ruleId}}: 헬스 체크 응답의 서버 시각
                import { describe, expect, inject, it } from 'vitest';

                describe('GET /api/health 서버 시각', () => {
                  it('응답 JSON에 time 문자열이 있다', async () => {
                    const res = await fetch(new URL('/api/health', inject('baseUrl')));
                    const body = (await res.json()) as { time?: unknown };
                    expect(typeof body.time).toBe('string');
                  });
                });
          - message: 인수 테스트 1개를 작성했습니다.
        result:
          subtype: success
          total_cost_usd: 0.03
          num_turns: 4
          modelUsage:
            model-a:
              inputTokens: 1500
              outputTokens: 600
              cacheReadInputTokens: 0
              cacheCreationInputTokens: 0
              costUSD: 0.03
