# 실행 유형 B: 정적 검사 규칙 [실행] (M3-06 #51, RUN-07, ADR-020 · ADR-136). e2e/pipeline/run-type-b.test.ts가 쓴다.
# 규칙 작성 세션이 인수 테스트 검사 규칙 1개(헬스 체크 ok 유지)를 만든다. 그 규칙의 인수 테스트는 시험이 사람 커밋으로 기준 브랜치에
# 올린다(유형 B에는 테스트 작성 단계가 없다: 검사 단계가 판정할 기존 인수 테스트가 있어야 한다).
# 구현 세션은 실행마다 순번이 0부터라 대상 규칙(세션 vars의 ruleId)으로 고른다. RULE-002 · 003은 블록 선언이 만드는 내장 규칙, RULE-004는 계약 검사 규칙.
# 구현 세션 1: undeclared-import 변형(health 블록이 auth 블록을 가져옴)의 가져오기를 지운다 (내장 방향 규칙 [실행]).
# 구현 세션 2: contract-mismatch 변형(GET /api/health의 ok가 글)을 계약(openapi.yaml)대로 boolean으로 되돌린다 (계약 검사 규칙 [실행]).
# 형식: src/agent/scenario.ts. 대상 픽스처: fixtures/sample-next-app.
name: run-type-b
description: 정적 검사 규칙(내장 방향 규칙 · OpenAPI 계약 검사 규칙)을 대상으로 한 유형 B 실행에서 구현 세션이 위반을 고쳐 검사 통과 · 병합
roles:
  rule-writer:
    sessions:
      - turns:
          - tool: propose_rule
            args:
              parentRequirementId: '{{requirementId}}'
              title: 헬스 체크 연결 상태
              statement: WHEN 클라이언트가 GET /api/health를 요청하면 THE SYSTEM SHALL 응답 JSON의 ok 값으로 true를 돌려준다
              kind: business
              checkKinds: [test]
              targetBlocks: [health]
              risk: medium
              behavior: new
              rationale: 요구사항의 '연결 상태 확인'을 HTTP 응답 본문으로 검사할 수 있는 형태로 옮김
              contradiction: { verdict: none }
          - message: 규칙 1건을 반영했습니다.
        result:
          subtype: success
          total_cost_usd: 0.0312
          num_turns: 3
          modelUsage:
            model-a:
              inputTokens: 1840
              outputTokens: 620
              cacheReadInputTokens: 0
              cacheCreationInputTokens: 5200
              costUSD: 0.0312
  implementer:
    sessions:
      - when: { ruleId: RULE-003 }
        turns:
          - tool: read_file
            args:
              path: src/app/api/health/session-probe.ts
          - tool: write_file
            args:
              path: src/app/api/health/session-probe.ts
              content: |
                /** 로그인 상태 확인: 선언하지 않은 auth 블록을 가져오지 않고 같은 응답을 만든다. */
                export function probeSession(): Response {
                  return Response.json({ authenticated: false }, { status: 401 });
                }
          - message: health 블록이 auth 블록을 가져오지 않게 고쳤습니다.
        result:
          subtype: success
          total_cost_usd: 0.0402
          num_turns: 3
          modelUsage:
            model-a:
              inputTokens: 2120
              outputTokens: 780
              cacheReadInputTokens: 6400
              cacheCreationInputTokens: 5100
              costUSD: 0.0402
      - when: { ruleId: RULE-004 }
        turns:
          - tool: read_file
            args:
              path: src/app/api/health/route.ts
          - tool: write_file
            args:
              path: src/app/api/health/route.ts
              content: |
                import { getDb } from '@/lib/db';

                // 요청마다 실행한다(빌드 시점 정적 생성 금지).
                export const dynamic = 'force-dynamic';

                /** 데이터베이스를 한 번 읽어 연결을 확인한 뒤 상태를 돌려준다 (계약: ok는 boolean). */
                export async function GET(): Promise<Response> {
                  await getDb().item.count();
                  return Response.json({ ok: true });
                }
          - message: 헬스 체크 응답의 ok를 계약대로 boolean으로 되돌렸습니다.
        result:
          subtype: success
          total_cost_usd: 0.0455
          num_turns: 3
          modelUsage:
            model-a:
              inputTokens: 2480
              outputTokens: 860
              cacheReadInputTokens: 7100
              cacheCreationInputTokens: 5300
              costUSD: 0.0455
