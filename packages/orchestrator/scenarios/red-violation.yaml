# Red 위반 (architecture.md 8장 "Red 위반 (구현 전 통과 테스트)", roadmap M1-15 · M1-21, RUN-03).
# 테스트 작성이 매번 이미 있는 동작(헬스 체크 200 · ok true)만 확인하는 인수 테스트를 쓴다. 구현 전에도 통과하므로
# Red 확인을 넘지 못하고 테스트 작성으로 돌아가며, 재시도 2회(테스트 작성 3회) 뒤 실행이 실패해야 한다.
# test-writer 세션은 하나뿐이라 매번 같은 세션을 반복한다(ADR-049). 구현 세션에는 도달하지 않는다.
# 대상 픽스처: fixtures/sample-next-app (GET /api/health가 { ok: true } 반환). 인수 테스트 위치 ADR-026, 도우미 ADR-068.
name: red-violation
description: 테스트 작성이 구현 전에도 통과하는 인수 테스트만 써서 Red 확인을 끝내 넘지 못함
roles:
  rule-writer:
    sessions:
      - turns:
          - tool: propose_rule
            args:
              parentRequirementId: '{{requirementId}}'
              title: 헬스 체크 응답의 서버 시각
              statement: WHEN 클라이언트가 GET /api/health를 요청하면 THE SYSTEM SHALL 응답 JSON의 time 필드에 응답 시점의 서버 시각을 ISO 8601 UTC 문자열로 담는다
              kind: business
              checkKinds: [test]
              rationale: 요구사항의 '서버 시각 포함'을 HTTP 응답 본문으로 검사할 수 있는 형태로 옮김
          - message: 규칙 제안 1건을 등록했습니다.
        result:
          subtype: success
          total_cost_usd: 0.0198
          num_turns: 2
          modelUsage:
            model-a:
              inputTokens: 1620
              outputTokens: 410
              cacheReadInputTokens: 0
              cacheCreationInputTokens: 5200
              costUSD: 0.0198
  test-writer:
    sessions:
      - description: 규칙의 새 동작(time)이 아니라 기존 동작만 확인 - 구현 전에도 통과
        turns:
          - tool: read_file
            args:
              path: rules/{{ruleId}}.md
          - tool: write_file
            args:
              path: bive-acceptance/{{ruleId}}/health-ok.acc.ts
              content: |
                // {{ruleId}}: 헬스 체크 응답. 기동된 서버에 HTTP로만 요청한다.
                import { request } from '@bive/http';
                import { describe, expect, it } from 'vitest';

                describe('GET /api/health 응답', () => {
                  it('상태 코드 200과 ok true를 돌려준다', async () => {
                    const res = await request('/api/health');

                    expect(res.status).toBe(200);
                    const body = (await res.json()) as { ok?: unknown };
                    expect(body.ok).toBe(true);
                  });
                });
          - message: 인수 테스트 1개를 작성했습니다.
        result:
          subtype: success
          total_cost_usd: 0.0384
          num_turns: 3
          modelUsage:
            model-a:
              inputTokens: 2210
              outputTokens: 700
              cacheReadInputTokens: 4100
              cacheCreationInputTokens: 6050
              costUSD: 0.0384
  implementer:
    sessions:
      - description: Red 확인을 넘지 못하므로 열리지 않아야 하는 세션
        turns:
          - message: 구현 세션이 열렸습니다 (Red 위반 시나리오에서는 열리면 안 됨).
        result:
          subtype: success
          total_cost_usd: 0.001
          num_turns: 1
          modelUsage:
            model-a:
              inputTokens: 100
              outputTokens: 20
              cacheReadInputTokens: 0
              cacheCreationInputTokens: 0
              costUSD: 0.001
